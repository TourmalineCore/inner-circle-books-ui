# overlay on top of books-api-docker-compose.yml
# adds layout-ui, and points books-api at the published image instead of building it from source
services:

  layout-ui:
    image: ghcr.io/tourmalinecore/inner-circle-layout-ui:latest
    container_name: inner-circle-layout-ui-local
    ports:
      - 4006:80

  inner-circle-books-api:
    image: ghcr.io/tourmalinecore/inner-circle-books-api:latest

  inner-circle-books-api-mock-server:
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-.}/mock-server-initialization.json:/config/mock-server-initialization.json
